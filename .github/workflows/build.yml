name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "ایپ کا نام"
        default: "My App"
      app_id:
        description: "Package ID (چھوٹے انگریزی حروف، مثلاً com.ali.shop)"
        default: "com.myapps.sample"
      version_code:
        description: "Version number (1, 2, 3...)"
        default: "1"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/webapp/shell app/src/main/res/values app/src/main/res/mipmap-xxxhdpi app/src/main/assets
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WebShell"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.webapp.shell'
              compileSdk 34
              defaultConfig {
                  applicationId "com.myapps.sample"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              aaptOptions { noCompress "html","js","css","json","ttf","woff","woff2" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">My App</string></resources>
          EOF
          cat > app/src/main/java/com/webapp/shell/MainActivity.kt <<'EOF'
          package com.webapp.shell

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              private lateinit var web: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  setContentView(web)
                  web.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      @Suppress("DEPRECATION")
                      allowFileAccessFromFileURLs = true
                      @Suppress("DEPRECATION")
                      allowUniversalAccessFromFileURLs = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                      mediaPlaybackRequiresUserGesture = false
                  }
                  web.webViewClient = WebViewClient()
                  if (savedInstanceState == null) web.loadUrl("file:///android_asset/index.html")
                  else web.restoreState(savedInstanceState)
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  web.saveState(outState)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
          EOF
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ur" dir="rtl"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>ٹیسٹ</title>
          <style>body{font-family:sans-serif;display:grid;place-items:center;height:100vh;margin:0;background:#f3f6fb}
          .c{background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 16px #0002;text-align:center}</style></head>
          <body><div class="c"><h2>ایپ کامیابی سے چل رہی ہے ✅</h2><p>اس فائل کو اپنی index.html سے بدل دیں۔</p></div></body></html>
          EOF
          convert -size 192x192 xc:'#1E64DC' -fill white -draw 'circle 96,96 96,50' app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Apply settings
        run: |
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ inputs.app_name }}</string>|" app/src/main/res/values/strings.xml
          sed -i "s|applicationId \".*\"|applicationId \"${{ inputs.app_id }}\"|" app/build.gradle
          sed -i "s|versionCode .*|versionCode ${{ inputs.version_code }}|" app/build.gradle
      - name: Use my files
        run: |
          if [ -f app.zip ]; then rm -rf app/src/main/assets/*; unzip -q app.zip -d app/src/main/assets; fi
          if [ -f index.html ]; then cp index.html app/src/main/assets/index.html; fi
          if [ -f icon.png ]; then convert icon.png -resize 192x192! app/src/main/res/mipmap-xxxhdpi/ic_launcher.png; fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
