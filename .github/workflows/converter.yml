          package com.webapp.maker;

          import java.io.ByteArrayOutputStream;
          import java.io.Closeable;
          import java.io.IOException;
          import java.io.OutputStream;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;
          import java.util.zip.CRC32;
          import java.util.zip.Deflater;

          /** Minimal ZIP writer. Stored entries are 4-byte aligned (needed for resources.arsc). */
          public class ZipWriter implements Closeable {
              private final OutputStream out;
              private long pos = 0;
              private final List<byte[]> central = new ArrayList<>();
              private final Set<String> names = new HashSet<>();
              private boolean finished = false;
              private static final int DOS_DATE = ((2026 - 1980) << 9) | (1 << 5) | 1;

              public ZipWriter(OutputStream o) {
                  this.out = o;
              }

              public boolean has(String name) {
                  return names.contains(name);
              }

              private void w(byte[] b) throws IOException {
                  out.write(b);
                  pos += b.length;
              }

              private static byte[] deflate(byte[] data) {
                  Deflater d = new Deflater(6, true);
                  d.setInput(data);
                  d.finish();
                  ByteArrayOutputStream bo = new ByteArrayOutputStream(Math.max(64, data.length / 2));
                  byte[] buf = new byte[65536];
                  while (!d.finished()) {
                      int n = d.deflate(buf);
                      bo.write(buf, 0, n);
                  }
                  d.end();
                  return bo.toByteArray();
              }

              private static boolean isAscii(byte[] b) {
                  for (byte x : b) {
                      if (x < 0) return false;
                  }
                  return true;
              }

              public void add(String name, byte[] data, boolean stored) throws IOException {
                  if (!names.add(name)) return;
                  if (names.size() > 65000) throw new IOException("Too many files in ZIP");
                  if (pos > 0x7FFFFFF0L) throw new IOException("APK too large");
                  byte[] nb = name.getBytes(StandardCharsets.UTF_8);
                  CRC32 crc = new CRC32();
                  crc.update(data, 0, data.length);
                  byte[] body = data;
                  int method = 0;
                  if (!stored && data.length > 64) {
                      byte[] d = deflate(data);
                      if (d.length < data.length) {
                          body = d;
                          method = 8;
                      }
                  }
                  int extraLen = 0;
                  if (stored) {
                      long start = pos + 30 + nb.length;
                      int pad = (int) ((4 - (start % 4)) % 4);
                      if (pad != 0) extraLen = pad + 4;
                  }
                  int flags = isAscii(nb) ? 0 : 0x0800;
                  ByteBuffer lh = ByteBuffer.allocate(30 + nb.length + extraLen).order(ByteOrder.LITTLE_ENDIAN);
                  lh.putInt(0x04034b50);
                  lh.putShort((short) 20);
                  lh.putShort((short) flags);
                  lh.putShort((short) method);
                  lh.putShort((short) 0);
                  lh.putShort((short) DOS_DATE);
                  lh.putInt((int) crc.getValue());
                  lh.putInt(body.length);
                  lh.putInt(data.length);
                  lh.putShort((short) nb.length);
                  lh.putShort((short) extraLen);
                  lh.put(nb);
                  if (extraLen > 0) {
                      lh.putShort((short) 0xD935);
                      lh.putShort((short) (extraLen - 4));
                      lh.put(new byte[extraLen - 4]);
                  }
                  long offset = pos;
                  w(lh.array());
                  w(body);

                  ByteBuffer ch = ByteBuffer.allocate(46 + nb.length).order(ByteOrder.LITTLE_ENDIAN);
                  ch.putInt(0x02014b50);
                  ch.putShort((short) 20);
                  ch.putShort((short) 20);
                  ch.putShort((short) flags);
                  ch.putShort((short) method);
                  ch.putShort((short) 0);
                  ch.putShort((short) DOS_DATE);
                  ch.putInt((int) crc.getValue());
                  ch.putInt(body.length);
                  ch.putInt(data.length);
                  ch.putShort((short) nb.length);
                  ch.putShort((short) 0);
                  ch.putShort((short) 0);
                  ch.putShort((short) 0);
                  ch.putShort((short) 0);
                  ch.putInt(0);
                  ch.putInt((int) offset);
                  ch.put(nb);
                  central.add(ch.array());
              }

              public void finish() throws IOException {
                  if (finished) return;
                  finished = true;
                  long cdStart = pos;
                  for (byte[] c : central) w(c);
                  long cdSize = pos - cdStart;
                  ByteBuffer e = ByteBuffer.allocate(22).order(ByteOrder.LITTLE_ENDIAN);
                  e.putInt(0x06054b50);
                  e.putShort((short) 0);
                  e.putShort((short) 0);
                  e.putShort((short) central.size());
                  e.putShort((short) central.size());
                  e.putInt((int) cdSize);
                  e.putInt((int) cdStart);
                  e.putShort((short) 0);
                  w(e.array());
                  out.flush();
              }

              @Override
              public void close() throws IOException {
                  try {
                      finish();
                  } finally {
                      out.close();
                  }
              }
          }
