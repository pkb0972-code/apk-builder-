          package com.webapp.maker;
          import java.io.*;
          import java.nio.*;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          import java.util.zip.*;
          public class AlignedZip implements Closeable {
              OutputStream out;long pos=0;List<byte[]> central=new ArrayList<>();Set<String> names=new HashSet<>();boolean finished;
              AlignedZip(OutputStream out){this.out=out;}
              boolean has(String name){return names.contains(name);}
              void write(byte[] b)throws IOException{out.write(b);pos+=b.length;}
              static byte[] compress(byte[] data){Deflater d=new Deflater(6,true);d.setInput(data);d.finish();ByteArrayOutputStream b=new ByteArrayOutputStream();byte[] buf=new byte[65536];while(!d.finished()){int n=d.deflate(buf);b.write(buf,0,n);}d.end();return b.toByteArray();}
              void add(String name,byte[] data,boolean stored)throws IOException{
                  if(!names.add(name))throw new IOException("Duplicate ZIP path: "+name);if(names.size()>60000)throw new IOException("Too many entries");
                  byte[] nb=name.getBytes(StandardCharsets.UTF_8);if(nb.length>65535)throw new IOException("Filename too long");
                  CRC32 crc=new CRC32();crc.update(data);byte[] body=data;int method=0;
                  if(!stored&&data.length>64){byte[] zipped=compress(data);if(zipped.length<data.length){body=zipped;method=8;}}
                  int extra=0;if(stored){int pad=(int)((4-((pos+30+nb.length)%4))%4);if(pad!=0)extra=4+pad;}
                  if(pos+body.length>0xFFFFFFFFL)throw new IOException("APK too large");
                  int flags=0x0800;ByteBuffer h=ByteBuffer.allocate(30+nb.length+extra).order(ByteOrder.LITTLE_ENDIAN);
                  h.putInt(0x04034b50);h.putShort((short)20);h.putShort((short)flags);h.putShort((short)method);h.putShort((short)0);h.putShort((short)0);
                  h.putInt((int)crc.getValue());h.putInt(body.length);h.putInt(data.length);h.putShort((short)nb.length);h.putShort((short)extra);h.put(nb);
                  if(extra>0){h.putShort((short)0xD935);h.putShort((short)(extra-4));h.put(new byte[extra-4]);}
                  long offset=pos;write(h.array());write(body);
                  ByteBuffer c=ByteBuffer.allocate(46+nb.length).order(ByteOrder.LITTLE_ENDIAN);
                  c.putInt(0x02014b50);c.putShort((short)20);c.putShort((short)20);c.putShort((short)flags);c.putShort((short)method);c.putShort((short)0);c.putShort((short)0);
                  c.putInt((int)crc.getValue());c.putInt(body.length);c.putInt(data.length);c.putShort((short)nb.length);c.putShort((short)0);c.putShort((short)0);c.putShort((short)0);c.putShort((short)0);c.putInt(0);c.putInt((int)offset);c.put(nb);central.add(c.array());
              }
              void finish()throws IOException{if(finished)return;finished=true;long start=pos;for(byte[] b:central)write(b);long size=pos-start;
                  ByteBuffer e=ByteBuffer.allocate(22).order(ByteOrder.LITTLE_ENDIAN);e.putInt(0x06054b50);e.putShort((short)0);e.putShort((short)0);e.putShort((short)central.size());e.putShort((short)central.size());e.putInt((int)size);e.putInt((int)start);e.putShort((short)0);write(e.array());out.flush();}
              @Override public void close()throws IOException{try{finish();}finally{out.close();}}
          }
