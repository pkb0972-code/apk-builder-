      - name: Build template APK
        run: cd template && gradle assembleRelease --no-daemon

      - name: Create offline signing assets
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/webmaker-key.pem -out /tmp/webmaker-cert.pem -days 3650 -subj '/CN=Web App Maker Test Key'
          openssl pkcs8 -topk8 -nocrypt -in /tmp/webmaker-key.pem -outform DER -out converter/app/src/main/assets/sign.pk8
          openssl x509 -in /tmp/webmaker-cert.pem -outform DER -out converter/app/src/main/assets/sign.crt
          cp template/app/build/outputs/apk/release/app-release-unsigned.apk converter/app/src/main/assets/template.apk

      - name: Build converter APK
        run: cd converter && gradle assembleDebug --no-daemon

      - name: Verify converter launcher icon
        shell: bash
        run: |
          set -euo pipefail
          APK=converter/app/build/outputs/apk/debug/app-debug.apk
          python3 - "$APK" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              for density in ('mdpi','hdpi','xhdpi','xxhdpi','xxxhdpi'):
                  for icon in ('ic_launcher.png','ic_launcher_round.png'):
                      name=f'res/mipmap-{density}/{icon}'
                      assert name in z.namelist(),f'Missing {name}'
              assert 'assets/template.apk' in z.namelist()
              print('Verified all 10 converter launcher icons and template APK')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: web-app-maker-v2-apk
          path: converter/app/build/outputs/apk/debug/app-debug.apk