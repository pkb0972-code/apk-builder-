          package com.webapp.maker;

          import com.android.apksig.ApkSigner;
          import com.android.apksig.ApkVerifier;

          import java.io.ByteArrayInputStream;
          import java.io.File;
          import java.io.IOException;
          import java.security.KeyFactory;
          import java.security.PrivateKey;
          import java.security.cert.CertificateFactory;
          import java.security.cert.X509Certificate;
          import java.security.spec.PKCS8EncodedKeySpec;
          import java.util.Collections;

          public class ApkSign {
              public static void sign(File in, File out, byte[] pk8, byte[] crt) throws Exception {
                  PrivateKey key = KeyFactory.getInstance("RSA").generatePrivate(new PKCS8EncodedKeySpec(pk8));
                  X509Certificate cert = (X509Certificate) CertificateFactory.getInstance("X.509")
                          .generateCertificate(new ByteArrayInputStream(crt));
                  ApkSigner.SignerConfig sc = new ApkSigner.SignerConfig.Builder(
                          "webmaker", key, Collections.singletonList(cert)).build();
                  if (out.exists()) out.delete();
                  ApkSigner signer = new ApkSigner.Builder(Collections.singletonList(sc))
                          .setInputApk(in)
                          .setOutputApk(out)
                          .setMinSdkVersion(21)
                          .setV1SigningEnabled(true)
                          .setV2SigningEnabled(true)
                          .setV3SigningEnabled(true)
                          .build();
                  signer.sign();
                  ApkVerifier.Result r = new ApkVerifier.Builder(out).build().verify();
                  if (!r.isVerified()) {
                      throw new IOException("Signature check failed: " + r.getErrors());
                  }
              }
          }
