name: Build Web App Maker
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/converter.yml'
      - 'converter-icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Android projects
        shell: bash
        run: |
          set -euo pipefail
          for project in template converter; do
            mkdir -p "$project/app/src/main/java/com/webapp/$([ "$project" = template ] && echo shell || echo maker)" "$project/app/src/main/res" "$project/app/src/main/assets"
            cat > "$project/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'WebAppProject'
          include ':app'
          EOF
            cat > "$project/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
            echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' > "$project/gradle.properties"
          done
          cat > template/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.webapp.shell'
              compileSdk 35
              defaultConfig { applicationId 'com.placeholder.appid'; minSdk 23; targetSdk 28; versionCode 1; versionName '1.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              lint { abortOnError false }
          }
          EOF
          cat > converter/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.webapp.maker'
              compileSdk 35
              defaultConfig { applicationId 'com.webapp.maker'; minSdk 29; targetSdk 35; versionCode 2; versionName '2.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              lint { abortOnError false }
          }
          dependencies { implementation 'com.android.tools.build:apksig:8.5.2' }
          EOF
          cat > template/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="PLACEHOLDERAPPNAME" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="false">
              <activity android:name="com.webapp.shell.MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > converter/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
            <application android:label="Web App Maker" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="false" android:allowBackup="false" android:largeHeap="true">
              <activity android:name="com.webapp.maker.MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > template/app/src/main/java/com/webapp/shell/MainActivity.java <<'EOF'
          package com.webapp.shell;
          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.net.*;
          import android.webkit.*;
          public class MainActivity extends Activity {
              WebView web; ValueCallback<Uri[]> files; static final int PICK=88;
              @Override public void onCreate(Bundle b){ super.onCreate(b); web=new WebView(this); setContentView(web);
                  WebSettings s=web.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true);
                  web.setWebViewClient(new WebViewClient(){@Override public boolean shouldOverrideUrlLoading(WebView v,String url){
                      if(url.startsWith("file:///android_asset/")) return false;
                      try{startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(url)));}catch(Exception ignored){} return true;
                  }});
                  web.setWebChromeClient(new WebChromeClient(){@Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> cb,FileChooserParams p){
                      if(files!=null)files.onReceiveValue(null); files=cb;
                      try{startActivityForResult(p.createIntent(),PICK);return true;}catch(Exception e){files=null;return false;}
                  }});
                  if(b==null)web.loadUrl("file:///android_asset/index.html");else web.restoreState(b);
              }
              @Override protected void onActivityResult(int req,int res,Intent data){super.onActivityResult(req,res,data);if(req==PICK&&files!=null){files.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res,data));files=null;}}
              @Override protected void onSaveInstanceState(Bundle b){super.onSaveInstanceState(b);web.saveState(b);}
              @Override public void onBackPressed(){if(web.canGoBack())web.goBack();else super.onBackPressed();}
          }
          EOF
          echo '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><h2>Web app ready</h2></body></html>' > template/app/src/main/assets/index.html

      - name: Install icon image library
        run: python3 -m pip install --user Pillow

      - name: Generate complete launcher icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,struct,zlib
          try:
              from PIL import Image,ImageDraw,ImageFont
          except ImportError:
              raise SystemExit('Pillow is required on the GitHub runner')
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for project in ('template','converter'):
              custom='converter-icon.png'
              if project=='converter' and os.path.isfile(custom):
                  im=Image.open(custom).convert('RGBA')
                  side=min(im.size); left=(im.width-side)//2; top=(im.height-side)//2
                  im=im.crop((left,top,left+side,top+side)).resize((512,512),Image.Resampling.LANCZOS)
              else:
                  im=Image.new('RGBA',(512,512),(24,103,222,255) if project=='template' else (17,123,100,255))
                  d=ImageDraw.Draw(im)
                  d.rounded_rectangle((54,54,458,458),radius=94,fill=(32,68,168) if project=='template' else (10,83,73))
                  if project=='template':
                      d.polygon([(190,142),(190,372),(370,257)],fill='white')
                  else:
                      d.rounded_rectangle((125,145,388,360),radius=28,outline='white',width=23)
                      d.polygon([(229,190),(229,310),(321,250)],fill='white')
              for dpi,size in sizes.items():
                  path=f'{project}/app/src/main/res/mipmap-{dpi}'
                  os.makedirs(path,exist_ok=True)
                  icon=im.resize((size,size),Image.Resampling.LANCZOS)
                  for name in ('ic_launcher.png','ic_launcher_round.png'):
                      icon.save(f'{path}/{name}',format='PNG')
          PY

      - name: Create converter UI
        shell: bash
        run: |
          cat > converter/app/src/main/assets/ui.html <<'EOF'
          <!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ویب ایپ میکر</title>
          <style>
          :root{--bg:#f1f5fb;--card:#fff;--text:#15233d;--muted:#68788d;--accent:#1666d8;--border:#dce5f0}
          @media(prefers-color-scheme:dark){:root{--bg:#0f1725;--card:#1b2638;--text:#ecf2fc;--muted:#a0afc2;--accent:#5c98ff;--border:#344154}}
          *{box-sizing:border-box}body{margin:0;padding:18px 14px 36px;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;line-height:1.9}h1{font-size:24px;margin:0}.sub{font-size:13px;color:var(--muted);margin:0 0 14px}.card{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:16px;margin-bottom:13px;box-shadow:0 2px 10px #0001}.head{font-weight:700;font-size:17px}label{font-size:13px;color:var(--muted);display:block;margin-top:8px}input{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--bg);color:var(--text);font-size:15px}button{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:650;cursor:pointer}button:disabled{opacity:.5}.primary{background:var(--accent);color:white;width:100%}.secondary{background:var(--card);border:1px solid var(--accent);color:var(--accent);width:100%}.note{font-size:13px;color:var(--muted);word-break:break-word;margin-top:6px}.good{color:#15976a}.bad{color:#e05252}#preview{display:none;width:76px;height:76px;border-radius:16px;object-fit:cover;margin-top:10px;border:1px solid var(--border)}#status,#result{display:none}.buttons{display:flex;gap:9px}.buttons button{flex:1}
          </style></head><body>
          <h1>📱 ویب ایپ میکر</h1><p class="sub">HTML یا ZIP سے APK بنائیں — آف لائن</p>
          <div class="card"><div class="head">۱ — ویب سائٹ کی فائل</div><button class="primary" id="pick">📂 HTML / ZIP منتخب کریں</button><div class="note" id="fileinfo">کوئی فائل منتخب نہیں</div></div>
          <div class="card"><div class="head">۲ — ایپ کی معلومات</div><label>ایپ کا نام</label><input id="appname" maxlength="60" placeholder="میری ایپ"><label>Package ID</label><input id="package" dir="ltr" spellcheck="false" autocapitalize="none"><div class="note">نئی ایپ کے لیے الگ Package ID استعمال کریں۔</div></div>
          <div class="card"><div class="head">۳ — ایپ کا آئیکن</div><button class="secondary" id="pickicon">🖼️ آئیکن منتخب کریں</button><img id="preview"><div class="note" id="iconinfo">PNG، JPG یا دوسری عام تصویر۔ چوکور بہتر ہے۔</div></div>
          <button class="primary" id="build">⚙️ APK تیار کریں</button>
          <div class="card" id="status"><div id="statustext"></div></div>
          <div class="card" id="result"><div class="good">✅ APK تیار ہے</div><div class="note" id="filename"></div><div class="buttons"><button class="primary" id="install">📲 انسٹال</button><button class="secondary" id="reset">➕ نئی ایپ</button></div><div class="note">Downloads / WebApps میں محفوظ ہے۔</div></div>
          <script>
          const $=id=>document.getElementById(id);let chosen=false,busy=false,edited=false;
          const newId=()=> 'com.webapp.a'+Math.random().toString(36).slice(2,10).padEnd(8,'0');$('package').value=newId();
          $('package').addEventListener('input',()=>edited=true);
          $('pick').onclick=()=>Android.pickMain();$('pickicon').onclick=()=>Android.pickIcon();
          $('build').onclick=()=>{if(busy)return;const n=$('appname').value.trim(),p=$('package').value.trim();if(!chosen)return alert('پہلے HTML یا ZIP منتخب کریں');if(!n)return alert('ایپ کا نام لکھیں');if(!/^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/.test(p))return alert('Package ID درست نہیں');busy=true;$('build').disabled=true;$('status').style.display='block';$('result').style.display='none';$('statustext').textContent='تیار ہو رہی ہے…';Android.build(n,p)};
          $('install').onclick=()=>Android.install();$('reset').onclick=()=>{Android.reset();chosen=false;busy=false;edited=false;$('appname').value='';$('package').value=newId();$('fileinfo').textContent='کوئی فائل منتخب نہیں';$('preview').style.display='none';$('iconinfo').textContent='چوکور تصویر بہتر ہے';$('status').style.display='none';$('result').style.display='none'};
          window.onNative=o=>{if(o.ev==='main'){chosen=true;$('fileinfo').textContent=o.name+' ('+Math.ceil(o.size/1024)+' KB)';if(!$('appname').value)$('appname').value=o.name.replace(/\.(html?|zip)$/i,'')}else if(o.ev==='main_error'){$('fileinfo').textContent=o.msg;chosen=false}else if(o.ev==='icon'){$('preview').src=o.data;$('preview').style.display='block';$('iconinfo').textContent='آئیکن منتخب ہوگیا'}else if(o.ev==='icon_error')$('iconinfo').textContent=o.msg;else if(o.ev==='progress')$('statustext').textContent=o.msg;else if(o.ev==='done'){busy=false;$('build').disabled=false;$('status').style.display='none';$('result').style.display='block';$('filename').textContent=o.file}else if(o.ev==='error'){busy=false;$('build').disabled=false;$('statustext').textContent='خرابی: '+o.msg;$('statustext').className='bad'}};
          </script></body></html>
          EOF

      - name: Create converter Java code
        shell: bash
        run: |
          cat > converter/app/src/main/java/com/webapp/maker/MainActivity.java <<'EOF'
          package com.webapp.maker;
          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.database.Cursor;
          import android.graphics.*;
          import android.net.Uri;
          import android.provider.*;
          import android.util.Base64;
          import android.webkit.*;
          import android.widget.Toast;
          import org.json.JSONObject;
          import java.io.*;
          import java.util.*;

          public class MainActivity extends Activity {
              static final int FILE=10, ICON=11;
              WebView web; File userFile; boolean userZip; Map<String,byte[]> icons; Uri output;
              volatile boolean busy=false;
              @Override public void onCreate(Bundle b){super.onCreate(b);web=new WebView(this);setContentView(web);
                  WebSettings s=web.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());web.addJavascriptInterface(new Bridge(),"Android");web.loadUrl("file:///android_asset/ui.html");}
              public class Bridge {
                  @JavascriptInterface public void pickMain(){runOnUiThread(()->pick("*/*",FILE));}
                  @JavascriptInterface public void pickIcon(){runOnUiThread(()->pick("image/*",ICON));}
                  @JavascriptInterface public void build(String n,String p){if(busy)return;busy=true;new Thread(()->make(n,p)).start();}
                  @JavascriptInterface public void install(){runOnUiThread(()->installApk());}
                  @JavascriptInterface public void reset(){if(!busy){userFile=null;icons=null;output=null;}}
              }
              void pick(String type,int request){Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT);i.addCategory(Intent.CATEGORY_OPENABLE);i.setType(type);startActivityForResult(i,request);}
              @Override protected void onActivityResult(int req,int result,Intent data){super.onActivityResult(req,result,data);if(result!=RESULT_OK||data==null||data.getData()==null)return;
                  Uri u=data.getData();new Thread(()->{if(req==FILE)loadFile(u);else if(req==ICON)loadIcon(u);}).start();}
              void event(String type,String key,Object value){try{JSONObject j=new JSONObject();j.put("ev",type);if(key!=null)j.put(key,value);String code="window.onNative("+j.toString()+")";runOnUiThread(()->web.evaluateJavascript(code,null));}catch(Exception ignored){}}
              String nameOf(Uri u){try(Cursor c=getContentResolver().query(u,null,null,null,null)){if(c!=null&&c.moveToFirst()){int i=c.getColumnIndex(OpenableColumns.DISPLAY_NAME);if(i>=0)return c.getString(i);}}catch(Exception ignored){}return "file";}
              static void copy(InputStream in,OutputStream out)throws IOException{byte[] buf=new byte[65536];int n;while((n=in.read(buf))!=-1)out.write(buf,0,n);}
              void loadFile(Uri u){try{String name=nameOf(u);File f=new File(getCacheDir(),"input-"+System.nanoTime());
                  try(InputStream in=getContentResolver().openInputStream(u);OutputStream out=new FileOutputStream(f)){if(in==null)throw new IOException("فائل نہیں کھل سکی");copy(in,out);}
                  if(f.length()==0||f.length()>80L*1024*1024)throw new IOException("فائل 1 بائٹ سے 80MB کے درمیان ہو");
                  boolean zip;try(InputStream in=new FileInputStream(f)){byte[] b=new byte[4];zip=in.read(b)==4&&b[0]==80&&b[1]==75&&b[2]==3&&b[3]==4;}
                  if(!zip&&!name.toLowerCase(Locale.ROOT).matches(".*\\.html?$"))throw new IOException("HTML یا ZIP فائل منتخب کریں");
                  if(zip)ApkMaker.findPrefix(f);userFile=f;userZip=zip;
                  JSONObject j=new JSONObject();j.put("ev","main");j.put("name",name);j.put("size",f.length());runOnUiThread(()->web.evaluateJavascript("window.onNative("+j.toString()+")",null));
                  }catch(Exception e){event("main_error","msg",e.getMessage());}}
              void loadIcon(Uri u){try{BitmapFactory.Options o=new BitmapFactory.Options();o.inJustDecodeBounds=true;
                  try(InputStream in=getContentResolver().openInputStream(u)){BitmapFactory.decodeStream(in,null,o);}
                  if(o.outWidth<=0||o.outHeight<=0)throw new IOException("تصویر درست نہیں");int sample=1;while(o.outWidth/sample>1024||o.outHeight/sample>1024)sample*=2;
                  BitmapFactory.Options opts=new BitmapFactory.Options();opts.inSampleSize=sample;Bitmap bitmap;
                  try(InputStream in=getContentResolver().openInputStream(u)){bitmap=BitmapFactory.decodeStream(in,null,opts);}
                  if(bitmap==null)throw new IOException("تصویر نہیں کھل سکی");int side=Math.min(bitmap.getWidth(),bitmap.getHeight());
                  Bitmap crop=Bitmap.createBitmap(bitmap,(bitmap.getWidth()-side)/2,(bitmap.getHeight()-side)/2,side,side);
                  String[] dpi={"mdpi","hdpi","xhdpi","xxhdpi","xxxhdpi"};int[] sizes={48,72,96,144,192};Map<String,byte[]> map=new HashMap<>();
                  for(int i=0;i<dpi.length;i++){Bitmap scaled=Bitmap.createScaledBitmap(crop,sizes[i],sizes[i],true);ByteArrayOutputStream bytes=new ByteArrayOutputStream();scaled.compress(Bitmap.CompressFormat.PNG,100,bytes);
                      for(String file:new String[]{"ic_launcher.png","ic_launcher_round.png"})map.put("res/mipmap-"+dpi[i]+"/"+file,bytes.toByteArray());scaled.recycle();}
                  icons=map;Bitmap preview=Bitmap.createScaledBitmap(crop,96,96,true);ByteArrayOutputStream b=new ByteArrayOutputStream();preview.compress(Bitmap.CompressFormat.PNG,100,b);
                  event("icon","data","data:image/png;base64,"+Base64.encodeToString(b.toByteArray(),Base64.NO_WRAP));
                  }catch(Exception e){event("icon_error","msg",e.getMessage());}}
              void make(String n,String p){try{n=n.trim();if(userFile==null)throw new IOException("HTML یا ZIP منتخب کریں");if(n.isEmpty()||n.length()>60)throw new IOException("نام 1 سے 60 حروف کا ہو");
                  if(!p.matches("^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"))throw new IOException("Package ID درست نہیں");
                  event("progress","msg","آئیکن اور ویب فائل شامل ہو رہی ہیں…");File template=new File(getCacheDir(),"template.apk");
                  try(InputStream in=getAssets().open("template.apk");OutputStream out=new FileOutputStream(template)){copy(in,out);}
                  File unsigned=new File(getCacheDir(),"unsigned.apk"),signed=new File(getCacheDir(),"signed.apk");
                  ApkMaker.make(template,userFile,userZip,icons,n,p,unsigned);
                  event("progress","msg","APK سائن اور چیک ہو رہی ہے…");
                  byte[] pk,crt;try(InputStream in=getAssets().open("sign.pk8")){pk=ApkMaker.readAll(in);}try(InputStream in=getAssets().open("sign.crt")){crt=ApkMaker.readAll(in);}
                  ApkSign.sign(unsigned,signed,pk,crt);
                  event("progress","msg","Downloads میں محفوظ ہو رہی ہے…");String fname=n.replaceAll("[\\\\/:*?\"<>|\\r\\n]","_")+".apk";
                  ContentValues v=new ContentValues();v.put(MediaStore.MediaColumns.DISPLAY_NAME,fname);v.put(MediaStore.MediaColumns.MIME_TYPE,"application/vnd.android.package-archive");
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH,Environment.DIRECTORY_DOWNLOADS+"/WebApps");v.put(MediaStore.MediaColumns.IS_PENDING,1);
                  Uri u=getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI,v);if(u==null)throw new IOException("Downloads میں فائل نہیں بنی");
                  try(InputStream in=new FileInputStream(signed);OutputStream out=getContentResolver().openOutputStream(u)){if(out==null)throw new IOException("فائل محفوظ نہیں ہوئی");copy(in,out);}
                  v.clear();v.put(MediaStore.MediaColumns.IS_PENDING,0);getContentResolver().update(u,v,null,null);output=u;event("done","file",fname);
                  unsigned.delete();signed.delete();
                  }catch(Exception e){event("error","msg",e.getMessage()==null?e.toString():e.getMessage());}finally{busy=false;}}
              void installApk(){if(output==null)return;try{if(!getPackageManager().canRequestPackageInstalls()){
                  startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,Uri.parse("package:"+getPackageName())));return;}
                  Intent i=new Intent(Intent.ACTION_VIEW);i.setDataAndType(output,"application/vnd.android.package-archive");i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);startActivity(i);
                  }catch(Exception e){Toast.makeText(this,"Downloads/WebApps سے APK کھولیں",Toast.LENGTH_LONG).show();}}
          }
          EOF
          cat > converter/app/src/main/java/com/webapp/maker/ApkSign.java <<'EOF'
          package com.webapp.maker;
          import com.android.apksig.ApkSigner;
          import com.android.apksig.ApkVerifier;
          import java.io.*;
          import java.security.*;
          import java.security.cert.*;
          import java.security.spec.*;
          import java.util.*;
          public class ApkSign {
              static void sign(File in,File out,byte[] pk,byte[] crt)throws Exception{
                  PrivateKey key=KeyFactory.getInstance("RSA").generatePrivate(new PKCS8EncodedKeySpec(pk));
                  X509Certificate cert=(X509Certificate)CertificateFactory.getInstance("X.509").generateCertificate(new ByteArrayInputStream(crt));
                  ApkSigner.SignerConfig cfg=new ApkSigner.SignerConfig.Builder("webmaker",key,Collections.singletonList(cert)).build();
                  ApkSigner signer=new ApkSigner.Builder(Collections.singletonList(cfg)).setInputApk(in).setOutputApk(out).setMinSdkVersion(23)
                      .setV1SigningEnabled(true).setV2SigningEnabled(true).setV3SigningEnabled(true).build();signer.sign();
                  ApkVerifier.Result result=new ApkVerifier.Builder(out).build().verify();if(!result.isVerified())throw new IOException("APK signature failed: "+result.getErrors());
              }
          }
          EOF
          cat > converter/app/src/main/java/com/webapp/maker/AxmlPatcher.java <<'EOF'
          package com.webapp.maker;
          import java.io.*;
          import java.nio.*;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          public class AxmlPatcher {
              static byte[] replace(byte[] input,Map<String,String> replacements)throws IOException{
                  ByteBuffer b=ByteBuffer.wrap(input).order(ByteOrder.LITTLE_ENDIAN);
                  if(input.length<40||(b.getShort(0)&65535)!=3)throw new IOException("Invalid binary manifest");
                  int header=b.getShort(2)&65535,base=header;
                  if((b.getShort(base)&65535)!=1)throw new IOException("Manifest string pool missing");
                  int poolHeader=b.getShort(base+2)&65535,poolSize=b.getInt(base+4),count=b.getInt(base+8),styles=b.getInt(base+12),flags=b.getInt(base+16),start=b.getInt(base+20);
