          package com.webapp.maker;

          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.charset.StandardCharsets;
          import java.util.Arrays;
          import java.util.HashSet;
          import java.util.Map;
          import java.util.Set;

          /** Replaces strings inside the string pool of a compiled (binary) AndroidManifest.xml. */
          public class AxmlPatcher {

              public static byte[] replaceStrings(byte[] in, Map<String, String> rep) throws IOException {
                  ByteBuffer b = ByteBuffer.wrap(in).order(ByteOrder.LITTLE_ENDIAN);
                  if (in.length < 40 || (b.getShort(0) & 0xFFFF) != 0x0003) throw new IOException("Manifest is not binary XML");
                  int hdr = b.getShort(2) & 0xFFFF;
                  int poolStart = hdr;
                  if ((b.getShort(poolStart) & 0xFFFF) != 0x0001) throw new IOException("String pool not found");
                  int poolHdr = b.getShort(poolStart + 2) & 0xFFFF;
                  int poolSize = b.getInt(poolStart + 4);
                  int count = b.getInt(poolStart + 8);
                  int styleCount = b.getInt(poolStart + 12);
                  int flags = b.getInt(poolStart + 16);
                  int stringsStart = b.getInt(poolStart + 20);
                  if (poolHdr != 28) throw new IOException("Unexpected pool header");
                  if (styleCount != 0) throw new IOException("Styled strings not supported");
                  boolean utf8 = (flags & 0x100) != 0;

                  String[] strs = new String[count];
                  for (int i = 0; i < count; i++) {
                      int off = b.getInt(poolStart + 28 + 4 * i);
                      int p = poolStart + stringsStart + off;
                      strs[i] = utf8 ? readUtf8(in, p) : readUtf16(b, p);
                  }

                  Set<String> found = new HashSet<>();
                  for (int i = 0; i < count; i++) {
                      if (rep.containsKey(strs[i])) {
                          found.add(strs[i]);
                          strs[i] = rep.get(strs[i]);
                      }
                  }
                  for (String k : rep.keySet()) {
                      if (!found.contains(k)) throw new IOException("Template placeholder not found: " + k);
                  }

                  ByteArrayOutputStream data = new ByteArrayOutputStream();
                  int[] offs = new int[count];
                  for (int i = 0; i < count; i++) {
                      offs[i] = data.size();
                      if (utf8) writeUtf8(data, strs[i]);
                      else writeUtf16(data, strs[i]);
                  }
                  while (data.size() % 4 != 0) data.write(0);
                  int newStringsStart = 28 + 4 * count;
                  int newPoolSize = newStringsStart + data.size();

                  int restStart = poolStart + poolSize;
                  int restLen = in.length - restStart;
                  if (restLen < 0) throw new IOException("Bad pool size");

                  ByteBuffer o = ByteBuffer.allocate(hdr + newPoolSize + restLen).order(ByteOrder.LITTLE_ENDIAN);
                  o.put(in, 0, hdr);
                  o.putInt(4, hdr + newPoolSize + restLen);
                  o.position(hdr);
                  o.putShort((short) 0x0001);
                  o.putShort((short) 28);
                  o.putInt(newPoolSize);
                  o.putInt(count);
                  o.putInt(0);
                  o.putInt(flags);
                  o.putInt(newStringsStart);
                  o.putInt(0);
                  for (int i = 0; i < count; i++) o.putInt(offs[i]);
                  o.put(data.toByteArray());
                  o.put(in, restStart, restLen);
                  return o.array();
              }

              private static String readUtf8(byte[] in, int p) {
                  if ((in[p] & 0x80) != 0) p += 2;
                  else p += 1;
                  int n = in[p] & 0xFF;
                  p++;
                  if ((n & 0x80) != 0) {
                      n = ((n & 0x7F) << 8) | (in[p] & 0xFF);
                      p++;
                  }
                  return new String(in, p, n, StandardCharsets.UTF_8);
              }

              private static String readUtf16(ByteBuffer b, int p) {
                  int n = b.getShort(p) & 0xFFFF;
                  p += 2;
                  if ((n & 0x8000) != 0) {
                      n = ((n & 0x7FFF) << 16) | (b.getShort(p) & 0xFFFF);
                      p += 2;
                  }
                  char[] c = new char[n];
                  for (int j = 0; j < n; j++) c[j] = (char) (b.getShort(p + 2 * j) & 0xFFFF);
                  return new String(c);
              }

              private static void writeLen8(ByteArrayOutputStream o, int v) throws IOException {
                  if (v > 0x7FFF) throw new IOException("String too long");
                  if (v > 0x7F) {
                      o.write((v >> 8) | 0x80);
                      o.write(v & 0xFF);
                  } else {
                      o.write(v);
                  }
              }

              private static void writeUtf8(ByteArrayOutputStream o, String s) throws IOException {
                  byte[] bytes = s.getBytes(StandardCharsets.UTF_8);
                  writeLen8(o, s.length());
                  writeLen8(o, bytes.length);
                  o.write(bytes, 0, bytes.length);
                  o.write(0);
              }

              private static void writeUtf16(ByteArrayOutputStream o, String s) throws IOException {
                  int n = s.length();
                  if (n > 0x7FFF) throw new IOException("String too long");
                  o.write(n & 0xFF);
                  o.write((n >> 8) & 0xFF);
                  for (int i = 0; i < n; i++) {
                      char c = s.charAt(i);
                      o.write(c & 0xFF);
                      o.write((c >> 8) & 0xFF);
                  }
                  o.write(0);
                  o.write(0);
              }
          }
