          package com.webapp.maker;
          import java.io.*;
          import java.util.*;
          import java.util.zip.*;
          public class ApkMaker {
              static byte[] readAll(InputStream in)throws IOException{ByteArrayOutputStream b=new ByteArrayOutputStream();byte[] buf=new byte[65536];int n;while((n=in.read(buf))!=-1){b.write(buf,0,n);if(b.size()>80*1024*1024)throw new IOException("File exceeds 80 MB");}return b.toByteArray();}
              static String safe(String path){String p=path.replace('\\','/');while(p.startsWith("/"))p=p.substring(1);if(p.isEmpty()||p.indexOf('\0')>=0)return null;for(String s:p.split("/"))if(s.equals("..")||s.equals("."))return null;return p;}
              static String findPrefix(File file)throws IOException{String best=null;int depth=999;
                  try(ZipFile z=new ZipFile(file)){Enumeration<? extends ZipEntry> entries=z.entries();int count=0;
                      while(entries.hasMoreElements()){ZipEntry e=entries.nextElement();if(++count>10000)throw new IOException("ZIP contains too many files");if(e.isDirectory())continue;String n=safe(e.getName());if(n==null)throw new IOException("Unsafe ZIP path");String low=n.toLowerCase(Locale.ROOT);
                          if(low.equals("index.html")||low.endsWith("/index.html")){int d=n.length()-n.replace("/","").length();if(d<depth){depth=d;best=n.substring(0,n.length()-10);}}}}
                  if(best==null)throw new IOException("ZIP میں index.html موجود نہیں");return best;}
              static void make(File template,File user,boolean zip,Map<String,byte[]> icons,String appName,String appId,File dest)throws IOException{
                  Map<String,String> replacements=new HashMap<>();replacements.put("com.placeholder.appid",appId);replacements.put("PLACEHOLDERAPPNAME",appName);
                  int iconCount=0;Set<String> expected=new HashSet<>();
                  if(icons!=null)expected.addAll(icons.keySet());
                  try(ZipFile source=new ZipFile(template);AlignedZip out=new AlignedZip(new BufferedOutputStream(new FileOutputStream(dest)))){
                      ZipEntry manifest=source.getEntry("AndroidManifest.xml");if(manifest==null)throw new IOException("Template manifest missing");
                      try(InputStream in=source.getInputStream(manifest)){out.add("AndroidManifest.xml",AxmlPatcher.replace(readAll(in),replacements),false);}
                      Enumeration<? extends ZipEntry> entries=source.entries();
                      while(entries.hasMoreElements()){ZipEntry e=entries.nextElement();String name=e.getName();if(e.isDirectory()||name.equals("AndroidManifest.xml")||name.startsWith("META-INF/")||name.startsWith("assets/"))continue;
                          byte[] data;try(InputStream in=source.getInputStream(e)){data=readAll(in);}
                          if(icons!=null&&icons.containsKey(name)){data=icons.get(name);iconCount++;expected.remove(name);}
                          out.add(name,data,name.equals("resources.arsc"));}
                      if(icons!=null&&(!expected.isEmpty()||iconCount!=10))throw new IOException("Not all launcher icons replaced: "+expected);
                      if(!out.has("resources.arsc")||!out.has("classes.dex"))throw new IOException("Incomplete template APK");
                      if(!zip){try(InputStream in=new FileInputStream(user)){out.add("assets/index.html",readAll(in),false);}}
                      else{String prefix=findPrefix(user);long total=0;try(ZipFile z=new ZipFile(user)){Enumeration<? extends ZipEntry> en=z.entries();
                          while(en.hasMoreElements()){ZipEntry e=en.nextElement();if(e.isDirectory())continue;String name=safe(e.getName());if(name==null)throw new IOException("Unsafe ZIP path");if(!name.startsWith(prefix))continue;
                              String rel=name.substring(prefix.length());if(rel.isEmpty())continue;if(rel.equalsIgnoreCase("index.html"))rel="index.html";
                              if(e.getSize()>32L*1024*1024)throw new IOException("ZIP file too large: "+rel);
                              byte[] bytes;try(InputStream in=z.getInputStream(e)){bytes=readAll(in);}total+=bytes.length;if(total>80L*1024*1024)throw new IOException("ZIP contents exceed 80 MB");
                              out.add("assets/"+rel,bytes,false);
                          }}}
                      if(!out.has("assets/index.html"))throw new IOException("index.html not added");
                  }
              }
          }
