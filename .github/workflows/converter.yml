          package com.webapp.maker;

          import java.io.BufferedOutputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.Enumeration;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipFile;

          /** Builds an unsigned APK from the template APK + user's HTML/ZIP. */
          public class ApkMaker {
              private static final long MAX_FILE = 64L * 1024 * 1024;

              static byte[] readAll(InputStream in) throws IOException {
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[65536];
                  int n;
                  while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                  return bo.toByteArray();
              }

              static String clean(String raw) {
                  String n = raw.replace('\\', '/');
                  while (n.startsWith("/")) n = n.substring(1);
                  if (n.isEmpty()) return null;
                  for (String seg : n.split("/")) {
                      if (seg.equals("..")) return null;
                  }
                  if (n.startsWith("__MACOSX/") || n.endsWith(".DS_Store")) return null;
                  return n;
              }

              /** Returns the folder prefix (possibly empty) where index.html lives inside the user's ZIP. */
              public static String findPrefix(File zipFile) throws IOException {
                  String bestPrefix = null;
                  int bestDepth = Integer.MAX_VALUE;
                  try (ZipFile z = new ZipFile(zipFile)) {
                      Enumeration<? extends ZipEntry> en = z.entries();
                      while (en.hasMoreElements()) {
                          ZipEntry e = en.nextElement();
                          if (e.isDirectory()) continue;
                          String n = clean(e.getName());
                          if (n == null) continue;
                          String lower = n.toLowerCase();
                          if (lower.equals("index.html") || lower.endsWith("/index.html")) {
                              int depth = 0;
                              for (int i = 0; i < n.length(); i++) {
                                  if (n.charAt(i) == '/') depth++;
                              }
                              if (depth < bestDepth) {
                                  bestDepth = depth;
                                  bestPrefix = n.substring(0, n.length() - "index.html".length());
                              }
                          }
                      }
                  }
                  if (bestPrefix == null) throw new IOException("ZIP کے اندر index.html نہیں ملی");
                  return bestPrefix;
              }

              public static void checkZip(File zipFile) throws IOException {
                  findPrefix(zipFile);
              }

              public static void make(File templateApk, File userFile, boolean userIsZip, byte[] iconPng,
                                      String appName, String appId, File out) throws IOException {
                  Map<String, String> rep = new HashMap<>();
                  rep.put("com.placeholder.appid", appId);
                  rep.put("PLACEHOLDERAPPNAME", appName);

                  try (ZipFile tpl = new ZipFile(templateApk);
                       ZipWriter zw = new ZipWriter(new BufferedOutputStream(new FileOutputStream(out), 65536))) {

                      ZipEntry me = tpl.getEntry("AndroidManifest.xml");
                      if (me == null) throw new IOException("Template has no manifest");
                      byte[] manifest;
                      try (InputStream in = tpl.getInputStream(me)) {
                          manifest = readAll(in);
                      }
                      zw.add("AndroidManifest.xml", AxmlPatcher.replaceStrings(manifest, rep), false);

                      Enumeration<? extends ZipEntry> en = tpl.entries();
                      while (en.hasMoreElements()) {
                          ZipEntry e = en.nextElement();
                          String name = e.getName();
                          if (e.isDirectory()) continue;
                          if (name.equals("AndroidManifest.xml")) continue;
                          if (name.startsWith("META-INF/")) continue;
                          if (name.startsWith("assets/")) continue;
                          byte[] data;
                          try (InputStream in = tpl.getInputStream(e)) {
                              data = readAll(in);
                          }
                          if (iconPng != null && name.startsWith("res/") && name.endsWith("/ic_launcher.png")) {
                              data = iconPng;
                          }
                          zw.add(name, data, name.equals("resources.arsc"));
                      }
                      if (!zw.has("classes.dex") || !zw.has("resources.arsc")) {
                          throw new IOException("Template APK is incomplete");
                      }

                      if (!userIsZip) {
                          byte[] html;
                          try (InputStream in = new FileInputStream(userFile)) {
                              html = readAll(in);
                          }
                          zw.add("assets/index.html", html, false);
                      } else {
                          String prefix = findPrefix(userFile);
                          try (ZipFile uz = new ZipFile(userFile)) {
                              Enumeration<? extends ZipEntry> ue = uz.entries();
                              while (ue.hasMoreElements()) {
                                  ZipEntry e = ue.nextElement();
                                  if (e.isDirectory()) continue;
                                  String n = clean(e.getName());
                                  if (n == null || !n.startsWith(prefix)) continue;
                                  String rel = n.substring(prefix.length());
                                  if (rel.isEmpty()) continue;
                                  if (rel.equalsIgnoreCase("index.html")) rel = "index.html";
                                  if (e.getSize() > MAX_FILE) {
                                      throw new IOException("فائل بہت بڑی ہے (64MB سے زیادہ): " + rel);
                                  }
                                  byte[] data;
                                  try (InputStream in = uz.getInputStream(e)) {
                                      data = readAll(in);
                                  }
                                  zw.add("assets/" + rel, data, false);
                              }
                          }
                      }
                  }
              }
          }
