          mkdir -p converter/app/src/main/assets
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/key.pem -out /tmp/cert.pem -days 36500 -subj "/CN=WebApp Maker"
          openssl pkcs8 -topk8 -nocrypt -in /tmp/key.pem -outform DER -out converter/app/src/main/assets/sign.pk8
          openssl x509 -in /tmp/cert.pem -outform DER -out converter/app/src/main/assets/sign.crt
          cp template/app/build/outputs/apk/release/app-release-unsigned.apk converter/app/src/main/assets/template.apk
          ls -la converter/app/src/main/assets/
      - name: Build converter APK
        run: |
          cd converter
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: converter-apk
          path: converter/app/build/outputs/apk/debug/app-debug.apk
